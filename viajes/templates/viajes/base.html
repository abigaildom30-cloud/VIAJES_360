{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102f3a">
    <title>{% block titulo %}Viajes Luma{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'viajes/css/estilos.css' %}?v=10">
</head>
<body>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap');

:root {
    --ink: #172f32;
    --muted: #74817d;
    --paper: #f7f6f1;
    --green: #355b50;
    --lime: #d7dfb4;
    --white: #fff;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "DM Sans", Arial, sans-serif;
}

a {
    color: inherit;
    text-decoration: none;
}

.encabezado {
    position: absolute;
    z-index: 5;
    top: 0;
    left: 0;
    display: flex;
    width: 100%;
    min-height: 82px;
    align-items: center;
    justify-content: space-between;
    padding: 0 7%;
    color: var(--white);
    border-bottom: 1px solid rgba(255,255,255,.2);
}

.logo {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--white);
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 3px;
}

.logo-icono {
    color: var(--lime);
    font-size: 1.5rem;
}

.logo-subtitulo {
    align-self: end;
    margin: 0 0 2px -5px;
    font-size: .54rem;
    letter-spacing: 2px;
}

.navegacion {
    display: flex;
    align-items: center;
    gap: 34px;
    font-size: .83rem;
}

.navegacion a {
    opacity: .9;
    transition: opacity .2s, color .2s;
}

.navegacion a:hover {
    color: var(--lime);
    opacity: 1;
}

.navegacion .enlace-contacto {
    padding: 11px 17px;
    border: 1px solid rgba(255,255,255,.55);
    border-radius: 30px;
}

.hero {
    position: relative;
    display: flex;
    min-height: 730px;
    align-items: center;
    overflow: hidden;
    background: #193b3b;
    color: white;
}

.hero-fondo {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(90deg, rgba(10,31,34,.72), rgba(10,31,34,.08)),
        linear-gradient(0deg, rgba(10,31,34,.3), transparent 40%),
        url("https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=2200&q=90")
        center 53% / cover;
    animation: zoomSuave 12s ease-out both;
}

.hero-contenido {
    position: relative;
    width: min(1120px, 86%);
    margin: 60px auto 0;
    animation: aparecer .9s ease both;
}

.eyebrow {
    display: inline-block;
    color: var(--lime);
    font-size: .69rem;
    font-weight: 700;
    letter-spacing: 2.5px;
}

.eyebrow-oscuro {
    color: var(--green);
}

.hero h1 {
    max-width: 800px;
    margin: 24px 0 20px;
    font-family: "Playfair Display", Georgia, serif;
    font-size: clamp(3.5rem, 8vw, 7rem);
    font-weight: 500;
    line-height: .98;
    letter-spacing: -3px;
}

.hero-contenido p {
    max-width: 480px;
    margin-bottom: 30px;
    color: rgba(255,255,255,.86);
    font-size: 1rem;
    line-height: 1.8;
}

.boton {
    display: inline-flex;
    min-height: 49px;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 0 21px;
    border-radius: 3px;
    font-size: .83rem;
    font-weight: 700;
    transition: transform .2s, background .2s;
}

.boton:hover {
    transform: translateY(-3px);
}

.boton-claro {
    background: var(--lime);
    color: var(--ink);
}

.boton-oscuro {
    background: var(--green);
    color: white;
}

.hero-pie {
    position: absolute;
    right: 7%;
    bottom: 30px;
    left: 7%;
    display: flex;
    justify-content: space-between;
    color: rgba(255,255,255,.75);
    font-size: .64rem;
    letter-spacing: 2px;
}

.seccion {
    padding: 100px 7%;
}

.intro {
    display: grid;
    grid-template-columns: 1.2fr .8fr;
    align-items: end;
    gap: 70px;
    background: var(--paper);
}

.intro h2,
.experiencia h2 {
    margin: 17px 0 0;
    color: var(--ink);
    font-family: "Playfair Display", Georgia, serif;
    font-size: clamp(2.5rem, 5vw, 4.5rem);
    font-weight: 500;
    line-height: 1.12;
}

.intro h2 em,
.experiencia h2 em {
    color: var(--green);
    font-weight: 500;
}

.intro > p,
.experiencia-texto > p {
    color: var(--muted);
    font-size: .96rem;
    line-height: 1.9;
}

.destinos-seccion {
    background: #fff;
}

.encabezado-seccion {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 25px;
    margin-bottom: 35px;
}

.encabezado-seccion h2,
.paises-titulo h2 {
    margin: 12px 0 0;
    color: var(--ink);
    font-family: "Playfair Display", Georgia, serif;
    font-size: clamp(2.3rem, 4vw, 3.6rem);
    font-weight: 500;
}

.enlace-flecha {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    color: var(--green);
    font-size: .85rem;
    font-weight: 700;
}

.enlace-flecha span {
    transition: transform .2s;
}

.enlace-flecha:hover span {
    transform: translate(4px, -3px);
}

.destinos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 23px;
}

.tarjeta {
    overflow: hidden;
    background: var(--paper);
    animation: aparecer .7s ease both;
}

.tarjeta-imagen {
    position: relative;
    height: 300px;
    overflow: hidden;
    background: #dfe5df;
}

.tarjeta-imagen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform .65s;
}

.tarjeta:hover .tarjeta-imagen img {
    transform: scale(1.06);
}

.etiqueta-imagen {
    position: absolute;
    bottom: 15px;
    left: 15px;
    padding: 7px 11px;
    background: rgba(20,40,38,.78);
    color: white;
    font-size: .67rem;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.tarjeta-contenido {
    padding: 19px 18px 22px;
}

.tarjeta-contenido h3 {
    margin: 0;
    color: var(--ink);
    font-family: "Playfair Display", Georgia, serif;
    font-size: 1.55rem;
    font-weight: 500;
}

.tarjeta-contenido p {
    color: var(--muted);
    font-size: .82rem;
}

.precio {
    margin: 13px 0;
    color: var(--green);
    font-size: .96rem;
    font-weight: 700;
}

.mensaje-vacio {
    grid-column: 1 / -1;
    padding: 25px;
    background: var(--paper);
    color: var(--muted);
}

.mensaje-vacio a {
    color: var(--green);
    text-decoration: underline;
}

.paises {
    padding: 92px 7% 105px;
    background: #e9ece3;
}

.paises-titulo {
    margin-bottom: 32px;
}

.paises-titulo h2 {
    margin-bottom: 0;
}

.paises-grid {
    display: grid;
    grid-template-columns: 1.15fr 1fr 1fr;
    gap: 18px;
}

.pais-card {
    position: relative;
    display: flex;
    min-height: 390px;
    flex-direction: column;
    justify-content: end;
    overflow: hidden;
    padding: 25px;
    color: white;
    background-position: center;
    background-size: cover;
    isolation: isolate;
    transition: background-size .4s, transform .3s;
}

.pais-card::before {
    position: absolute;
    z-index: -1;
    inset: 0;
    background: linear-gradient(0deg, rgba(8,24,25,.75), transparent 70%);
    content: "";
}

.pais-card:hover {
    transform: translateY(-5px);
}

.pais-card > span {
    font-size: .66rem;
    letter-spacing: 2px;
}

.pais-card strong {
    margin-top: 7px;
    font-family: "Playfair Display", Georgia, serif;
    font-size: 2.6rem;
    font-weight: 500;
}

.pais-card small {
    margin-top: 5px;
    color: rgba(255,255,255,.85);
}

.pais-japon {
    background-image: url("https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=1100&q=85");
}

.pais-italia {
    background-image: url("https://images.unsplash.com/photo-1516483638261-f4dbaf036963?auto=format&fit=crop&w=1000&q=85");
}

.pais-peru {
    background-image: url("https://images.unsplash.com/photo-1526392060635-9d6019884377?auto=format&fit=crop&w=1000&q=85");
}

.experiencia {
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    gap: 8%;
    background: var(--paper);
}

.experiencia-foto {
    min-height: 460px;
    background:
        url("https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1200&q=85")
        center / cover;
}

.experiencia-texto {
    max-width: 470px;
}

.experiencia-texto h2 {
    margin-bottom: 18px;
}

.experiencia-texto > p {
    margin-bottom: 25px;
}

.cierre {
    padding: 85px 20px;
    background:
        linear-gradient(rgba(18,43,43,.76), rgba(18,43,43,.76)),
        url("https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1800&q=85")
        center 55% / cover;
    color: white;
    text-align: center;
}

.cierre h2 {
    margin: 15px 0 25px;
    font-family: "Playfair Display", Georgia, serif;
    font-size: clamp(2.5rem, 5vw, 4.5rem);
    font-weight: 500;
}

.pie {
    display: flex;
    min-height: 120px;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 25px 7%;
    background: #142d2d;
    color: rgba(255,255,255,.75);
    font-size: .78rem;
}

.pie p {
    margin: 0;
}

.logo-pie {
    color: white;
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(22px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes zoomSuave {
    from {
        transform: scale(1.07);
    }
    to {
        transform: scale(1);
    }
}

@media (max-width: 760px) {
    .encabezado {
        position: absolute;
        align-items: flex-start;
        padding: 20px 6%;
    }

    .navegacion {
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 12px 16px;
        font-size: .75rem;
    }

    .navegacion a:nth-child(3),
    .navegacion a:nth-child(4) {
        display: none;
    }

    .hero {
        min-height: 680px;
    }

    .hero-contenido {
        width: 88%;
        margin-top: 80px;
    }

    .hero h1 {
        letter-spacing: -1.5px;
    }

    .seccion,
    .paises {
        padding: 65px 6%;
    }

    .intro,
    .experiencia {
        grid-template-columns: 1fr;
        gap: 20px;
    }

    .encabezado-seccion {
        align-items: flex-start;
        flex-direction: column;
    }

    .paises-grid {
        grid-template-columns: 1fr;
    }

    .pais-card {
        min-height: 300px;
    }

    .experiencia-foto {
        min-height: 320px;
    }

    .pie {
        align-items: flex-start;
        flex-direction: column;
        padding-inline: 6%;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
    
}
.pagina-interna {
    display: flex;
    min-height: 430px;
    align-items: end;
    padding: 120px 7% 60px;
    color: white;
    background:
        linear-gradient(90deg, rgba(14, 41, 43, 0.86), rgba(14, 41, 43, 0.12)),
        url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1800&q=85")
        center/cover;
}

.pagina-interna h1 {
    margin: 12px 0 0;
    font-family: "Playfair Display", Georgia, serif;
    font-size: clamp(3rem, 7vw, 5.5rem);
    line-height: 1;
}

.buscador-avanzado {
    display: grid;
    grid-template-columns: 1fr 220px auto;
    gap: 12px;
    margin-bottom: 20px;
    padding: 12px;
    background: white;
    box-shadow: 0 10px 30px rgba(20, 45, 45, 0.09);
}

.buscador-avanzado input,
.buscador-avanzado select {
    min-width: 0;
    height: 49px;
    border: 1px solid #dfe5e1;
    border-radius: 3px;
    padding: 0 13px;
    background: white;
    color: #172f32;
    font: inherit;
}

.contador-resultados {
    color: #74817d;
    font-size: 0.86rem;
}

@media (max-width: 720px) {
    .pagina-interna {
        min-height: 350px;
    }

    .buscador-avanzado {
        grid-template-columns: 1fr;
    }
}
/* Página de servicios */
.servicios-hero,
.destinos-hero {
    display: flex;
    min-height: 490px;
    align-items: end;
    padding: 120px 8% 65px;
    color: white;
    background-position: center;
    background-size: cover;
}

.servicios-hero {
    background-image:
        linear-gradient(90deg, rgba(12, 35, 38, .78), rgba(12, 35, 38, .18)),
        url("https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1900&q=85");
}

.destinos-hero {
    background-image:
        linear-gradient(90deg, rgba(12, 35, 38, .78), rgba(12, 35, 38, .15)),
        url("https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1900&q=85");
}

.servicios-hero-contenido {
    max-width: 720px;
    animation: aparecer .8s ease both;
}

.servicios-hero h1,
.destinos-hero h1 {
    max-width: 800px;
    margin: 15px 0;
    font-family: "Playfair Display", Georgia, serif;
    font-size: clamp(3rem, 7vw, 5.8rem);
    font-weight: 500;
    line-height: 1;
}

.servicios-hero p,
.destinos-hero p {
    max-width: 550px;
    margin-bottom: 25px;
    color: rgba(255,255,255,.86);
    line-height: 1.8;
}

.servicios-intro {
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: end;
    gap: 60px;
    padding: 85px 8%;
}

.servicios-intro h2,
.seccion-cabecera h2,
.destinos-pagina-cabecera h2 {
    margin: 12px 0 0;
    color: var(--ink);
    font-family: "Playfair Display", Georgia, serif;
    font-size: clamp(2.2rem, 4vw, 3.4rem);
    font-weight: 500;
    line-height: 1.12;
}

.servicios-intro > p {
    color: var(--muted);
    line-height: 1.9;
}

.servicios-lista,
.servicios-destacados {
    padding: 75px 8%;
    background: white;
}

.seccion-cabecera {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 25px;
    margin-bottom: 30px;
}

.servicios-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.servicio-pro {
    position: relative;
    min-height: 285px;
    padding: 28px;
    border: 1px solid #e8eae4;
    background: #fbfbf8;
    transition: transform .25s, box-shadow .25s;
}

.servicio-pro:hover {
    transform: translateY(-6px);
    box-shadow: var(--sombra);
}

.servicio-numero {
    position: absolute;
    top: 24px;
    right: 24px;
    color: #a4afa4;
    font-size: .75rem;
    letter-spacing: 1px;
}

.servicio-icono {
    margin-bottom: 18px;
    color: var(--green);
    font-size: 2rem;
}

.servicio-pro h3 {
    color: var(--ink);
    font-family: "Playfair Display", Georgia, serif;
    font-size: 1.6rem;
    font-weight: 500;
}

.servicio-pro p {
    min-height: 70px;
    color: var(--muted);
    font-size: .9rem;
    line-height: 1.7;
}

.servicios-estadisticas {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    padding: 42px 8%;
    background: #e9ece3;
}

.servicios-estadisticas div {
    display: flex;
    flex-direction: column;
    text-align: center;
}

.servicios-estadisticas strong {
    color: var(--green);
    font-family: "Playfair Display", Georgia, serif;
    font-size: 2.3rem;
    font-weight: 500;
}

.servicios-estadisticas span {
    color: var(--muted);
    font-size: .85rem;
}

.servicios-destinos-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.servicio-destino {
    position: relative;
    display: flex;
    min-height: 330px;
    flex-direction: column;
    justify-content: end;
    overflow: hidden;
    padding: 22px;
    color: white;
    background: #334b45;
}

.servicio-destino::after {
    position: absolute;
    inset: 0;
    background: linear-gradient(0deg, rgba(8,24,25,.78), transparent 75%);
    content: "";
}

.servicio-destino img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform .5s;
}

.servicio-destino:hover img {
    transform: scale(1.06);
}

.servicio-destino span,
.servicio-destino strong,
.servicio-destino small {
    position: relative;
    z-index: 1;
}

.servicio-destino span {
    font-size: .68rem;
    letter-spacing: 1.5px;
}

.servicio-destino strong {
    font-family: "Playfair Display", Georgia, serif;
    font-size: 2rem;
    font-weight: 500;
}

.servicio-destino small {
    margin-top: 5px;
}

.servicios-cta {
    padding: 75px 8%;
    background:
        linear-gradient(rgba(18,43,43,.78), rgba(18,43,43,.78)),
        url("https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1800&q=85")
        center/cover;
    color: white;
    text-align: center;
}

.servicios-cta h2 {
    margin: 12px 0 25px;
    font-family: "Playfair Display", Georgia, serif;
    font-size: clamp(2.5rem, 5vw, 4rem);
    font-weight: 500;
}

.busqueda-servicios {
    display: flex;
    width: min(600px, 100%);
    gap: 8px;
    margin: auto;
    padding: 8px;
    background: white;
}

.busqueda-servicios input {
    flex: 1;
    min-width: 0;
    border: 0;
    padding: 12px;
    font: inherit;
}

/* Página de destinos y filtros */
.destinos-pagina {
    padding: 75px 8%;
}

.destinos-pagina-cabecera {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 28px;
}

.destinos-pagina-cabecera > p {
    color: var(--muted);
}

.filtros-destinos {
    display: grid;
    grid-template-columns: 1.5fr 1fr 1fr auto auto;
    align-items: end;
    gap: 12px;
    margin-bottom: 30px;
    padding: 18px;
    background: white;
    box-shadow: 0 10px 30px rgba(20, 45, 45, .08);
}

.campo-busqueda {
    display: flex;
    flex-direction: column;
    gap: 7px;
    color: var(--muted);
    font-size: .76rem;
}

.campo-busqueda input,
.campo-busqueda select {
    width: 100%;
    height: 45px;
    border: 1px solid #e1e6e1;
    border-radius: 2px;
    padding: 0 11px;
    background: white;
    color: var(--ink);
    font: inherit;
}

.limpiar-filtros {
    padding: 12px 4px;
    color: var(--green);
    font-size: .82rem;
    font-weight: 700;
}

.destinos-grid-pro {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 22px;
}

.destino-pro {
    overflow: hidden;
    background: white;
    box-shadow: 0 8px 26px rgba(18, 59, 82, .07);
    animation: aparecer .5s ease both;
    transition: transform .25s, box-shadow .25s;
}

.destino-pro:hover {
    transform: translateY(-5px);
    box-shadow: var(--sombra);
}

.destino-pro-imagen {
    position: relative;
    height: 250px;
    overflow: hidden;
    background: #dfe5df;
}

.destino-pro-imagen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform .5s;
}

.destino-pro:hover .destino-pro-imagen img {
    transform: scale(1.05);
}

.destino-pais,
.destino-badge {
    position: absolute;
    top: 14px;
    padding: 7px 10px;
    background: rgba(20, 40, 38, .78);
    color: white;
    font-size: .65rem;
    letter-spacing: 1px;
}

.destino-pais {
    left: 14px;
}

.destino-badge {
    right: 14px;
    background: var(--lime);
    color: var(--ink);
}

.destino-pro-info {
    padding: 19px;
}

.destino-titulo {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.destino-titulo h3 {
    margin: 3px 0;
    font-family: "Playfair Display", Georgia, serif;
    font-size: 1.6rem;
    font-weight: 500;
}

.destino-ciudad {
    color: var(--muted);
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.destino-icono {
    color: var(--green);
}

.destino-pro-info > p {
    min-height: 50px;
    color: var(--muted);
    font-size: .85rem;
    line-height: 1.6;
}

.destino-meta {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 14px 0;
    border-top: 1px solid #edf0eb;
    color: var(--muted);
    font-size: .8rem;
}

.destino-meta strong {
    color: var(--green);
}

.destino-consultar {
    display: flex;
    justify-content: space-between;
    padding-top: 12px;
    border-top: 1px solid #edf0eb;
    color: var(--green);
    font-size: .84rem;
    font-weight: 700;
}

.sin-resultados {
    grid-column: 1 / -1;
    padding: 60px 20px;
    background: white;
    text-align: center;
}

.sin-resultados > span {
    color: var(--green);
    font-size: 3rem;
}

.sin-resultados h3 {
    font-family: "Playfair Display", Georgia, serif;
    font-size: 2rem;
    font-weight: 500;
}

.sin-resultados p {
    color: var(--muted);
}

@media (max-width: 900px) {
    .destinos-grid-pro {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .filtros-destinos {
        grid-template-columns: 1fr 1fr;
    }

    .servicios-grid {
        grid-template-columns: 1fr 1fr;
    }
}

@media (max-width: 620px) {
    .servicios-intro,
    .servicios-grid,
    .servicios-destinos-grid,
    .destinos-grid-pro,
    .servicios-estadisticas {
        grid-template-columns: 1fr;
    }

    .servicios-intro,
    .servicios-lista,
    .servicios-destacados,
    .destinos-pagina {
        padding: 55px 6%;
    }

    .destinos-pagina-cabecera {
        align-items: flex-start;
        flex-direction: column;
    }

    .filtros-destinos {
        grid-template-columns: 1fr;
    }

    .busqueda-servicios {
        flex-direction: column;
    }
}
/* Página Nosotros */
.nosotros-hero,
.contacto-hero {
    display: flex;
    min-height: 570px;
    align-items: end;
    padding: 130px 8% 70px;
    color: white;
    background-position: center;
    background-size: cover;
}

.nosotros-hero {
    background-image:
        linear-gradient(90deg, rgba(12, 35, 38, .77), rgba(12, 35, 38, .12)),
        url("https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?auto=format&fit=crop&w=1900&q=85");
}

.nosotros-hero-contenido,
.contacto-hero-contenido {
    max-width: 760px;
    animation: aparecer .8s ease both;
}

.nosotros-hero h1,
.contacto-hero h1 {
    margin: 18px 0;
    font-family: "Playfair Display", Georgia, serif;
    font-size: clamp(3.2rem, 7vw, 6rem);
    font-weight: 500;
    line-height: 1.02;
}

.nosotros-hero p,
.contacto-hero p {
    max-width: 560px;
    color: rgba(255,255,255,.86);
    font-size: 1rem;
    line-height: 1.8;
}

.nosotros-intro {
    display: grid;
    grid-template-columns: 1.1fr .9fr;
    align-items: end;
    gap: 65px;
    padding: 90px 8%;
    background: var(--paper);
}

.nosotros-intro h2,
.nosotros-historia h2,
.nosotros-seccion-titulo h2,
.contacto-info h2 {
    margin: 14px 0 0;
    color: var(--ink);
    font-family: "Playfair Display", Georgia, serif;
    font-size: clamp(2.2rem, 4.5vw, 3.7rem);
    font-weight: 500;
    line-height: 1.12;
}

.nosotros-intro > p,
.nosotros-historia-texto p,
.contacto-info > p {
    color: var(--muted);
    line-height: 1.9;
}

.nosotros-historia {
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    gap: 8%;
    padding: 35px 8% 100px;
    background: var(--paper);
}

.nosotros-foto-principal {
    min-height: 500px;
    background:
        url("https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1200&q=85")
        center / cover;
}

.nosotros-historia-texto {
    max-width: 520px;
}

.nosotros-historia-texto h2 {
    margin-bottom: 20px;
}

.nosotros-historia-texto .enlace-flecha {
    margin-top: 15px;
}

.nosotros-valores {
    padding: 85px 8%;
    background: #e9ece3;
}

.nosotros-seccion-titulo {
    max-width: 650px;
    margin-bottom: 35px;
}

.valores-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.valor-card {
    position: relative;
    min-height: 250px;
    padding: 28px;
    background: rgba(255,255,255,.72);
    transition: transform .25s, box-shadow .25s;
}

.valor-card:hover {
    transform: translateY(-5px);
    box-shadow: var(--sombra);
}

.valor-numero {
    position: absolute;
    top: 24px;
    right: 24px;
    color: #9aa79d;
    font-size: .75rem;
}

.valor-icono {
    color: var(--green);
    font-size: 1.8rem;
}

.valor-card h3 {
    margin: 20px 0 8px;
    color: var(--ink);
    font-family: "Playfair Display", Georgia, serif;
    font-size: 1.5rem;
    font-weight: 500;
}

.valor-card p {
    color: var(--muted);
    font-size: .9rem;
    line-height: 1.7;
}

.nosotros-galeria {
    padding: 85px 8%;
    background: white;
}

.nosotros-galeria-cabecera {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 25px;
    margin-bottom: 30px;
}

.nosotros-galeria-cabecera h2 {
    margin: 12px 0 0;
    color: var(--ink);
    font-family: "Playfair Display", Georgia, serif;
    font-size: clamp(2.2rem, 4vw, 3.5rem);
    font-weight: 500;
}

.galeria-paises {
    display: grid;
    grid-template-columns: 1.2fr 1fr 1fr;
    gap: 17px;
}

.galeria-item {
    display: flex;
    min-height: 350px;
    flex-direction: column;
    justify-content: end;
    padding: 22px;
    color: white;
    background-position: center;
    background-size: cover;
    transition: transform .25s;
}

.galeria-item:hover {
    transform: translateY(-5px);
}

.galeria-item span {
    font-size: .68rem;
    letter-spacing: 2px;
}

.galeria-item h3 {
    margin: 6px 0 0;
    font-family: "Playfair Display", Georgia, serif;
    font-size: 2.4rem;
    font-weight: 500;
}

.galeria-japon {
    background-image:
        linear-gradient(0deg, rgba(10,25,26,.7), transparent 70%),
        url("https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=1000&q=85");
}

.galeria-italia {
    background-image:
        linear-gradient(0deg, rgba(10,25,26,.7), transparent 70%),
        url("https://images.unsplash.com/photo-1516483638261-f4dbaf036963?auto=format&fit=crop&w=1000&q=85");
}

.galeria-peru {
    background-image:
        linear-gradient(0deg, rgba(10,25,26,.7), transparent 70%),
        url("https://images.unsplash.com/photo-1526392060635-9d6019884377?auto=format&fit=crop&w=1000&q=85");
}

.nosotros-cta {
    padding: 80px 20px;
    background:
        linear-gradient(rgba(18,43,43,.78), rgba(18,43,43,.78)),
        url("https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1800&q=85")
        center / cover;
    color: white;
    text-align: center;
}

.nosotros-cta h2 {
    margin: 15px 0 25px;
    font-family: "Playfair Display", Georgia, serif;
    font-size: clamp(2.3rem, 5vw, 4rem);
    font-weight: 500;
}

/* Página Contacto */
.contacto-hero {
    min-height: 460px;
    background-image:
        linear-gradient(90deg, rgba(12, 35, 38, .8), rgba(12, 35, 38, .12)),
        url("https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1900&q=85");
}

.contacto-seccion {
    padding: 85px 8%;
    background: var(--paper);
}

.contacto-layout {
    display: grid;
    grid-template-columns: .85fr 1.15fr;
    gap: 8%;
    max-width: 1160px;
    margin: 0 auto;
}

.contacto-info h2 {
    font-size: clamp(2.1rem, 4vw, 3.2rem);
}

.contacto-info > p {
    margin: 20px 0 30px;
}

.contacto-dato {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-top: 22px;
}

.contacto-dato-icono {
    display: grid;
    width: 43px;
    height: 43px;
    flex: 0 0 43px;
    place-items: center;
    background: #e7ebe1;
    color: var(--green);
    font-size: 1.2rem;
}

.contacto-dato div {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.contacto-dato small {
    color: var(--muted);
}

.contacto-dato strong,
.contacto-dato a {
    color: var(--ink);
    font-size: .9rem;
}

.contacto-nota {
    display: flex;
    gap: 12px;
    margin-top: 35px;
    padding: 17px;
    border-left: 3px solid var(--green);
    background: #e9ece3;
}

.contacto-nota span {
    color: var(--green);
}

.contacto-nota p {
    margin: 0;
    color: #61716b;
    font-size: .85rem;
    line-height: 1.6;
}

.contacto-formulario {
    padding: 35px;
    background: white;
    box-shadow: 0 15px 45px rgba(18,59,82,.08);
}

.contacto-formulario h2 {
    margin: 0;
    color: var(--ink);
    font-family: "Playfair Display", Georgia, serif;
    font-size: 2rem;
    font-weight: 500;
}

.contacto-formulario > p {
    margin: 8px 0 25px;
    color: var(--muted);
    font-size: .9rem;
}

.formulario-contacto {
    display: flex;
    flex-direction: column;
    gap: 17px;
}

.formulario-contacto label {
    display: flex;
    flex-direction: column;
    gap: 7px;
    color: var(--ink);
    font-size: .8rem;
    font-weight: 600;
}

.formulario-dos-campos {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.formulario-contacto input,
.formulario-contacto textarea {
    width: 100%;
    border: 1px solid #e0e5df;
    border-radius: 2px;
    padding: 13px;
    background: #fdfdfb;
    color: var(--ink);
    font: inherit;
    font-size: .88rem;
}

.formulario-contacto input:focus,
.formulario-contacto textarea:focus {
    border-color: var(--green);
    outline: 2px solid rgba(53,91,80,.12);
}

.formulario-contacto textarea {
    resize: vertical;
}

.formulario-contacto .boton {
    align-self: flex-start;
}

.formulario-privacidad {
    color: var(--muted);
    font-size: .72rem;
}

.mensaje-alerta {
    padding: 12px 14px;
    font-size: .88rem;
}

.mensaje-alerta.success {
    background: #e7f3e8;
    color: #245c35;
}

.mensaje-alerta.error {
    background: #fbe9e7;
    color: #8a3026;
}

.contacto-franja {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 28px 8%;
    background: #e9ece3;
}

.contacto-franja p {
    margin: 0;
    color: var(--ink);
}

@media (max-width: 760px) {
    .nosotros-hero,
    .contacto-hero {
        min-height: 480px;
        padding: 120px 6% 55px;
    }

    .nosotros-intro,
    .nosotros-historia,
    .contacto-layout {
        grid-template-columns: 1fr;
        gap: 30px;
    }

    .nosotros-intro,
    .nosotros-valores,
    .nosotros-galeria,
    .contacto-seccion {
        padding: 60px 6%;
    }

    .nosotros-historia {
        padding: 15px 6% 60px;
    }

    .nosotros-foto-principal {
        min-height: 330px;
    }

    .valores-grid,
    .galeria-paises {
        grid-template-columns: 1fr;
    }

    .galeria-item {
        min-height: 280px;
    }

    .nosotros-galeria-cabecera,
    .contacto-franja {
        align-items: flex-start;
        flex-direction: column;
    }

    .contacto-formulario {
        padding: 24px;
    }

    .formulario-dos-campos {
        grid-template-columns: 1fr;
    }
}
